name: リンク切れチェック (lychee)

on:
  schedule:
    # 毎日 AM 9:00 JST (UTC 0:00) に実行
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  link-checker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: '--verbose --accept 200,403 https://puppets.jp/'
          fail: false

      - name: Create Issue From File
        if: env.lychee_exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 'リンク切れが検出されました'
          content-filepath: ./lychee/out.md
          labels: bug
