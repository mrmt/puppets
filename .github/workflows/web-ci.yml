name: CI

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches-ignore:
      - main
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN は読み取りのみ (チェックアウト用)。Cloudflare 操作は専用シークレットを使う
permissions:
  contents: read

jobs:
  check:
    name: Typecheck + Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 12
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 12
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Restore font cache
        id: font-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: web/node_modules/.astro/fonts
          key: astro-fonts-${{ runner.os }}-${{ hashFiles('web/astro.config.mjs', 'web/pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            astro-fonts-${{ runner.os }}-${{ hashFiles('web/astro.config.mjs', 'web/pnpm-lock.yaml') }}-
            astro-fonts-${{ runner.os }}-

      - run: pnpm build
      # 起動時例外 (error 1101) の検出: ビルド成果物を wrangler dev で起動して確認
      - run: ./scripts/smoke-test.sh

      - name: Save font cache
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: web/node_modules/.astro/fonts
          key: ${{ steps.font-cache.outputs.cache-primary-key }}

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 12
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
